# 当前文件仅在 local-infra Profile 激活时生效；要求 PostgreSQL、Redis 和 RabbitMQ 已启动。
# Spring Boot 当前激活的配置 Profile。
spring.config.activate.on-profile=local-infra
# PostgreSQL JDBC 连接地址，可通过 DB_URL 覆盖。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ming_harness}
# PostgreSQL JDBC 驱动类名。
spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL 登录用户名，可通过 DB_USERNAME 覆盖。
spring.datasource.username=${DB_USERNAME:ming_harness}
# PostgreSQL 登录密码，可通过 DB_PASSWORD 覆盖；生产环境应使用密钥系统注入。
spring.datasource.password=${DB_PASSWORD:ming_harness}
# Hibernate 只校验表结构，不允许应用启动时自动修改 PostgreSQL 结构。
spring.jpa.hibernate.ddl-auto=validate
# 是否启用 Flyway 数据库迁移。
spring.flyway.enabled=true
# Flyway 迁移脚本所在的 classpath 目录。
spring.flyway.locations=classpath:db/migration
# 迁移执行后校验数据库版本和脚本校验和。
spring.flyway.validate-on-migrate=true
# 禁止在没有基线记录的数据库上自动创建基线。
spring.flyway.baseline-on-migrate=false

# PostgreSQL 17 已安装 pgvector，本轮仅启用扩展，不固定 embedding 维度。
# 是否启用 PostgreSQL pgvector 扩展，可通过 ENABLE_VECTOR_EXTENSION 覆盖。
harness.database.enable-vector-extension=${ENABLE_VECTOR_EXTENSION:true}
# 运行执行模式，可选同步执行或 RabbitMQ 异步执行。
harness.execution.mode=${HARNESS_EXECUTION_MODE:rabbit}

# local-infra 是本机开发 Profile，默认开启受控工作区以支持聊天附件；生产部署应显式覆盖此开关和目录。
# 是否启用受控工作区及聊天附件能力。
harness.workspace.enabled=${WORKSPACE_ENABLED:true}

# Redis 只用于共享限流和短期执行锁，不保存业务正文。
# 是否启用 Redis 共享治理能力。
harness.redis.enabled=${REDIS_ENABLED:true}
# Redis 执行锁租期（毫秒）。
harness.redis.lock-ttl-ms=${REDIS_LOCK_TTL_MS:30000}
# 获取组织配额锁的最大等待时间（毫秒）。
harness.redis.quota-lock-wait-ms=${REDIS_QUOTA_LOCK_WAIT_MS:1000}
# Redis 服务主机名，可通过 REDIS_HOST 覆盖。
spring.data.redis.host=${REDIS_HOST:localhost}
# Redis 服务端口，可通过 REDIS_PORT 覆盖。
spring.data.redis.port=${REDIS_PORT:6379}
# Redis 登录用户名；为空表示不使用 ACL 用户名。
spring.data.redis.username=${REDIS_USERNAME:}
# Redis 登录密码；为空表示无密码。
spring.data.redis.password=${REDIS_PASSWORD:}
# Redis 使用的逻辑数据库编号。
spring.data.redis.database=${REDIS_DATABASE:0}

# RabbitMQ 只承载执行命令，业务状态仍以 PostgreSQL 为准。
# 是否启用 RabbitMQ 消息和 Outbox Relay。
harness.messaging.enabled=${RABBITMQ_ENABLED:true}
# RabbitMQ 执行命令交换机名称。
harness.messaging.exchange=${RABBITMQ_EXCHANGE:harness.runtime}
# RabbitMQ 执行命令队列名称。
harness.messaging.queue=${RABBITMQ_QUEUE:harness.run.execute}
# RabbitMQ 执行命令路由键。
harness.messaging.routing-key=${RABBITMQ_ROUTING_KEY:run.execute}
# RabbitMQ 死信交换机名称。
harness.messaging.dead-letter-exchange=${RABBITMQ_DLX:harness.runtime.dlx}
# RabbitMQ 死信队列名称。
harness.messaging.dead-letter-queue=${RABBITMQ_DLQ:harness.run.execute.dlq}
# Outbox 事件最多发布尝试次数。
harness.messaging.max-attempts=${RABBITMQ_MAX_ATTEMPTS:3}
# Outbox Relay 轮询待发布事件的间隔（毫秒）。
harness.messaging.outbox-poll-ms=${OUTBOX_POLL_MS:1000}
# Outbox 发布租约时长（毫秒），用于避免多实例重复发布。
harness.messaging.outbox-claim-lease-ms=${OUTBOX_CLAIM_LEASE_MS:30000}
# RabbitMQ Worker 初始消费者并发数。
harness.messaging.consumer-concurrency=${RABBITMQ_CONSUMER_CONCURRENCY:1}
# RabbitMQ Worker 消费者并发数上限。
harness.messaging.max-consumer-concurrency=${RABBITMQ_MAX_CONSUMER_CONCURRENCY:4}
# 每个 RabbitMQ 消费者的预取消息数。
harness.messaging.prefetch=${RABBITMQ_PREFETCH:1}
# RabbitMQ 队列达到此深度后暂停 Outbox 发布以实施背压。
harness.messaging.max-queue-depth=${RABBITMQ_MAX_QUEUE_DEPTH:1000}
# RabbitMQ 队列深度和容量指标的轮询间隔（毫秒）。
harness.messaging.queue-metrics-poll-ms=${RABBITMQ_QUEUE_METRICS_POLL_MS:5000}
# RabbitMQ 服务主机名，可通过 RABBITMQ_HOST 覆盖。
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
# RabbitMQ 服务端口，可通过 RABBITMQ_PORT 覆盖。
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
# RabbitMQ 登录用户名，可通过 RABBITMQ_USERNAME 覆盖。
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
# RabbitMQ 登录密码，可通过 RABBITMQ_PASSWORD 覆盖。
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# RabbitMQ 发布确认模式，correlated 用于将确认关联到具体消息。
spring.rabbitmq.publisher-confirm-type=correlated
# 是否接收 RabbitMQ 发布返回消息。
spring.rabbitmq.publisher-returns=true
# RabbitMQ 监听器确认模式；auto 由容器自动确认或重新投递。
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# RabbitMQ 监听器每个消费者的预取消息数。
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH:1}
# 是否暴露 Redis 健康检查组件。
management.health.redis.enabled=${REDIS_ENABLED:true}
# 是否暴露 RabbitMQ 健康检查组件。
management.health.rabbit.enabled=${RABBITMQ_ENABLED:true}
# local-infra 覆盖测试配置时仍需显式暴露受 RBAC 保护的运行指标端点。
# Actuator 对外暴露的端点列表。
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# 基础设施模式默认开启保留清理；生产部署应根据合规要求覆盖各保留天数。
# 是否启用数据保留清理任务。
harness.data-retention.enabled=${DATA_RETENTION_ENABLED:true}
