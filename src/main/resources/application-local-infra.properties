# 本地基础设施配置，要求 PostgreSQL、Redis 和 RabbitMQ 已经启动。
spring.config.activate.on-profile=local-infra
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ming_harness}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:ming_harness}
spring.datasource.password=${DB_PASSWORD:ming_harness}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# PostgreSQL 17 已安装 pgvector，本轮仅启用扩展，不固定 embedding 维度。
harness.database.enable-vector-extension=${ENABLE_VECTOR_EXTENSION:true}
harness.execution.mode=${HARNESS_EXECUTION_MODE:rabbit}

# Redis 只用于共享限流和短期执行锁，不保存业务正文。
harness.redis.enabled=${REDIS_ENABLED:true}
harness.redis.lock-ttl-ms=${REDIS_LOCK_TTL_MS:30000}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
