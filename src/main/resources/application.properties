# Spring Boot 应用名称，也作为指标默认标签值。
spring.application.name=ming-harness
# HTTP 服务监听端口，可通过 SERVER_PORT 覆盖。
server.port=${SERVER_PORT:8080}
# 未显式指定 Profile 时使用的默认 Profile。
spring.profiles.default=local-infra

# 聊天附件单个文件允许的最大大小，可通过 HARNESS_ATTACHMENT_MAX_FILE_SIZE 覆盖。
spring.servlet.multipart.max-file-size=${HARNESS_ATTACHMENT_MAX_FILE_SIZE:25MB}
# 单次聊天附件请求允许的最大总大小，可通过 HARNESS_ATTACHMENT_MAX_REQUEST_SIZE 覆盖。
spring.servlet.multipart.max-request-size=${HARNESS_ATTACHMENT_MAX_REQUEST_SIZE:30MB}

# 关闭 Open Session in View，避免 Web 请求期间意外访问数据库。
spring.jpa.open-in-view=false
# Hibernate JDBC 读写时间统一使用 UTC 时区。
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 默认不执行 Flyway；local-infra Profile 会显式启用。
spring.flyway.enabled=false
# 禁用 Spring Data Redis Repository 自动扫描，Redis 仅用于治理和锁。
spring.data.redis.repositories.enabled=false

# JSON 序列化时省略值为 null 的属性。
spring.jackson.default-property-inclusion=non_null

# 日志级别格式中附带请求和链路追踪标识，便于日志检索。
logging.pattern.level=%5p [request:%X{requestId:-},trace:%X{traceId:-}]

# Actuator 对外暴露的端点列表。
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# 是否启用 Kubernetes liveness/readiness 健康探针。
management.endpoint.health.probes.enabled=true
# Actuator 健康端点显示详情的策略；默认仅已授权访问者可见。
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
# Actuator 健康端点显示组件列表的策略；默认仅已授权访问者可见。
management.endpoint.health.show-components=${MANAGEMENT_HEALTH_SHOW_COMPONENTS:when_authorized}
# 所有 Micrometer 指标附带的应用名称标签。
management.metrics.tags.application=${spring.application.name}

# 运行执行模式；可由 local/local-infra Profile 或 HARNESS_EXECUTION_MODE 覆盖。
harness.execution.mode=${HARNESS_EXECUTION_MODE:sync}
# 是否将本地同步执行切换为进程内后台 Worker，使桌面聊天无需等待模型完成。
harness.local-execution.async=${LOCAL_ASYNC_EXECUTION:false}
# 允许跨域访问 API 的前端来源列表，多个来源使用逗号分隔。
harness.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 身份认证模式；local 接受本地请求头，api-key 使用静态密钥，oidc 使用 JWT。
harness.auth.mode=${HARNESS_AUTH_MODE:local}
# 静态 API Key 列表，格式为 密钥|组织ID|用户ID|权限1,权限2；生产环境应由密钥系统注入。
harness.auth.api-keys=${HARNESS_API_KEYS:}

# 审计完整性链使用的 HMAC 密钥；生产环境必须从密钥系统注入 AUDIT_INTEGRITY_KEY。
harness.audit.integrity-key=${AUDIT_INTEGRITY_KEY:local-development-audit-integrity-key-change-me}

# 是否启用真实外部模型；仅当启用且配置 API Key 后才访问供应商。
harness.model.enabled=${MODEL_ENABLED:false}
# OpenAI 兼容模型服务的基础地址。
harness.model.base-url=${MODEL_BASE_URL:https://api.openai.com/v1}
# 主模型服务 API Key；生产环境必须从密钥系统注入。
harness.model.api-key=${MODEL_API_KEY:}
# 用户保存的模型 API Key 的加密密钥；未设置时复用工作区路径加密密钥。
harness.model.secret-encryption-key=${MODEL_SECRET_ENCRYPTION_KEY:${WORKSPACE_PATH_ENCRYPTION_KEY:local-development-workspace-path-key-change-me}}
# 主模型服务的模型名称。
harness.model.name=${MODEL_NAME:deepseek-chat}
# 备用模型服务的基础地址；为空时不启用备用服务。
harness.model.fallback-base-url=${MODEL_FALLBACK_BASE_URL:}
# 备用模型服务 API Key。
harness.model.fallback-api-key=${MODEL_FALLBACK_API_KEY:}
# 备用模型名称；为空时复用主模型名称。
harness.model.fallback-name=${MODEL_FALLBACK_NAME:}
# 单次模型请求最多尝试次数，包含首次请求。
harness.model.max-attempts=${MODEL_MAX_ATTEMPTS:3}
# 模型请求重试间隔（毫秒）。
harness.model.retry-backoff-ms=${MODEL_RETRY_BACKOFF_MS:200}
# 连续失败达到该次数时打开模型服务熔断器。
harness.model.circuit-failure-threshold=${MODEL_CIRCUIT_FAILURE_THRESHOLD:3}
# 模型服务熔断器打开后的持续时间（毫秒）。
harness.model.circuit-open-ms=${MODEL_CIRCUIT_OPEN_MS:30000}
# 模型输入每 1,000 Token 的计费金额，用于成本统计。
harness.model.input-cost-per-1k-tokens=${MODEL_INPUT_COST_PER_1K_TOKENS:0}
# 模型输出每 1,000 Token 的计费金额，用于成本统计。
harness.model.output-cost-per-1k-tokens=${MODEL_OUTPUT_COST_PER_1K_TOKENS:0}
# 单次模型响应允许持久化的最大字符数。
harness.model.max-response-chars=${MODEL_MAX_RESPONSE_CHARS:100000}
# 默认提示词版本标识，用于运行和评测记录。
harness.prompt.version=${PROMPT_VERSION:prompt-v1}
# 默认策略版本标识，用于运行和评测记录。
harness.policy.version=${POLICY_VERSION:policy-v1}

# 是否启用 Agent 受控工作区能力。
harness.workspace.enabled=${WORKSPACE_ENABLED:false}
# Agent 可访问的受控工作区根目录；生产环境应指向专用目录。
harness.workspace.root=${HARNESS_WORKSPACE_ROOT:./workspace}
# 单次工作区文件读取的最大字节数。
harness.workspace.max-read-bytes=${WORKSPACE_MAX_READ_BYTES:1000000}
# 单次工作区文件写入的最大字节数。
harness.workspace.max-write-bytes=${WORKSPACE_MAX_WRITE_BYTES:1000000}
# 单次工作区目录列表最多返回的条目数。
harness.workspace.max-list-entries=${WORKSPACE_MAX_LIST_ENTRIES:200}
# 单次工作区搜索最多扫描的文件数。
harness.workspace.max-search-files=${WORKSPACE_MAX_SEARCH_FILES:2000}
# 单次工作区搜索最多返回的命中数。
harness.workspace.max-search-results=${WORKSPACE_MAX_SEARCH_RESULTS:200}
# 单次工作区文本读取最多返回的行数。
harness.workspace.max-read-lines=${WORKSPACE_MAX_READ_LINES:2000}
# 是否允许工作区工具访问隐藏文件。
harness.workspace.allow-hidden-files=${WORKSPACE_ALLOW_HIDDEN_FILES:false}
# 是否允许 Agent 在工作区执行受白名单约束的命令。
harness.workspace.exec-enabled=${WORKSPACE_EXEC_ENABLED:false}
# 可执行命令白名单，多个命令使用逗号分隔；为空时不允许执行任何命令。
harness.workspace.allowed-commands=${WORKSPACE_ALLOWED_COMMANDS:}
# 单个工作区命令允许执行的最长时间（毫秒）。
harness.workspace.max-command-timeout-ms=${WORKSPACE_MAX_COMMAND_TIMEOUT_MS:120000}
# 单个工作区命令允许返回的最大输出字节数。
harness.workspace.max-command-output-bytes=${WORKSPACE_MAX_COMMAND_OUTPUT_BYTES:200000}
# 单个工作区命令允许的最大参数数量。
harness.workspace.max-command-args=${WORKSPACE_MAX_COMMAND_ARGS:32}
# 工作区搜索中每条命中的最大字符数。
harness.workspace.max-search-match-chars=${WORKSPACE_MAX_SEARCH_MATCH_CHARS:512}
# 工作区工具结果整体允许返回的最大字符数。
harness.workspace.max-tool-output-chars=${WORKSPACE_MAX_TOOL_OUTPUT_CHARS:4000}
# 本地工作区绝对路径的 AES-GCM 加密密钥；正式环境必须单独配置。
harness.workspace.path-encryption-key=${WORKSPACE_PATH_ENCRYPTION_KEY:local-development-workspace-path-key-change-me}
# 是否允许原生桌面目录选择桥接登记用户显式选择的本地工作区。
harness.workspace.local-registration-enabled=${WORKSPACE_LOCAL_REGISTRATION_ENABLED:false}
# 仅 Electron/Tauri 主进程使用的本地桥接令牌，绝不能暴露给网页 JavaScript 或聊天记录。
harness.workspace.desktop-bridge-token=${HARNESS_DESKTOP_BRIDGE_TOKEN:}

# 单个组织同时处于活动状态的 Run 数量上限。
harness.runtime.max-active-runs-per-tenant=${MAX_ACTIVE_RUNS_PER_TENANT:20}
# 单次 Run 允许创建的步骤数上限。
harness.runtime.max-steps-per-run=${MAX_STEPS_PER_RUN:1000}
# 单次 Run 输入内容的最大字符数。
harness.runtime.max-input-length=${MAX_INPUT_LENGTH:10000}
# 单次 Run 可使用的预算上限。
harness.runtime.max-budget=${MAX_RUN_BUDGET:1000}
# 单次模型调用的超时时间（毫秒）。
harness.runtime.model-timeout-ms=${MODEL_TIMEOUT_MS:30000}
# 构建模型上下文时允许的最大字符数。
harness.runtime.max-context-chars=${MAX_CONTEXT_CHARS:64000}
# 父文档子块的最大字符数；接入 embedding 模型后仍会在供应商 token 限制内二次裁剪。
harness.context.chunk-max-chars=${CONTEXT_CHUNK_MAX_CHARS:1600}
# 相邻子块之间保留的尾部重叠字符数，避免语义在边界处断裂。
harness.context.chunk-overlap-chars=${CONTEXT_CHUNK_OVERLAP_CHARS:160}
# 连续子块物化成父窗口时的最大字符数；父窗口只用于推理，不参与向量召回。
harness.context.parent-window-max-chars=${CONTEXT_PARENT_WINDOW_MAX_CHARS:4800}
# 知识库导入单个 PDF/DOCX 文件的最大大小；正文解析后仍受字符上限约束。
harness.context.document.max-upload-bytes=${CONTEXT_DOCUMENT_MAX_UPLOAD_BYTES:26214400}
# PDF/DOCX 解析后允许写入知识库的最大正文字符数。
harness.context.document.max-content-chars=${CONTEXT_DOCUMENT_MAX_CONTENT_CHARS:100000}
# 是否使用 embedding API 按句子相似度寻找语义分块边界；关闭时使用确定性分块。
harness.context.semantic-enabled=${CONTEXT_SEMANTIC_ENABLED:false}
# 相邻原子单元余弦相似度低于该值时允许切分。
harness.context.semantic-breakpoint=${CONTEXT_SEMANTIC_BREAKPOINT:0.35}
# 至少累计多少个原子单元后才按语义断点切分，避免产生过多极小 chunk。
harness.context.semantic-min-units=${CONTEXT_SEMANTIC_MIN_UNITS:3}
# 正文事务提交后再调度语义重分块和上下文 embedding，队列满时由重建接口继续处理。
harness.context.index.async-enabled=${CONTEXT_INDEX_ASYNC_ENABLED:true}
# 上下文 embedding 后台线程数。
harness.context.index.concurrency=${CONTEXT_INDEX_CONCURRENCY:2}
# 上下文 embedding 后台队列容量。
harness.context.index.queue-capacity=${CONTEXT_INDEX_QUEUE_CAPACITY:100}
# 是否启用外部 embedding API；关闭时上下文仍使用关键词召回。
harness.embedding.enabled=${EMBEDDING_ENABLED:false}
# OpenAI 兼容 embedding 服务基础地址。
harness.embedding.base-url=${EMBEDDING_BASE_URL:https://api.openai.com/v1}
# embedding API Key，仅通过环境变量或密钥系统注入。
harness.embedding.api-key=${EMBEDDING_API_KEY:}
# embedding 模型名称；向量维度必须与 V22 迁移一致。
harness.embedding.model=${EMBEDDING_MODEL:text-embedding-3-small}
# embedding 模型版本或供应商配置版本；变更后会自动隔离旧缓存，避免复用过期向量。
harness.embedding.model-version=${EMBEDDING_MODEL_VERSION:v1}
# embedding 向量维度，当前 pgvector 迁移固定为 1536。
harness.embedding.dimension=${EMBEDDING_DIMENSION:1536}
# 单次 embedding API 请求最多发送的文本块数量。
harness.embedding.batch-size=${EMBEDDING_BATCH_SIZE:20}
# 单条 embedding 输入的字符上限。
harness.embedding.max-input-chars=${EMBEDDING_MAX_INPUT_CHARS:12000}
# 单条 embedding 输入的保守 token 上限；字符上限和 token 上限同时生效。
harness.embedding.max-input-tokens=${EMBEDDING_MAX_INPUT_TOKENS:8192}
# embedding 响应体字符上限。
harness.embedding.max-response-chars=${EMBEDDING_MAX_RESPONSE_CHARS:1000000}
# embedding API 单次请求最大尝试次数。
harness.embedding.max-attempts=${EMBEDDING_MAX_ATTEMPTS:3}
# embedding API 重试初始退避毫秒数。
harness.embedding.retry-backoff-ms=${EMBEDDING_RETRY_BACKOFF_MS:200}
# embedding API 连接和读取超时时间。
harness.embedding.timeout-ms=${EMBEDDING_TIMEOUT_MS:30000}
# 向量召回最多读取的候选子块数量。
harness.context.retrieval.candidate-limit=${CONTEXT_RETRIEVAL_CANDIDATE_LIMIT:20}
# 查询阶段候选池扩展倍数；最终仍按 max-parents 控制父窗口数量。
harness.context.retrieval.candidate-expansion-factor=${CONTEXT_RETRIEVAL_CANDIDATE_EXPANSION_FACTOR:3}
# 候选池中每个父来源最多保留的子块数量，避免单篇文档占满向量候选池。
harness.context.retrieval.max-candidates-per-parent=${CONTEXT_RETRIEVAL_MAX_CANDIDATES_PER_PARENT:4}
# 最终最多展开的父文档数量。
harness.context.retrieval.max-parents=${CONTEXT_RETRIEVAL_MAX_PARENTS:5}
# 命中子块两侧补回的相邻子块数量。
harness.context.retrieval.neighbor-radius=${CONTEXT_RETRIEVAL_NEIGHBOR_RADIUS:1}
# 余弦相似度最低阈值，低于该阈值时交给关键词召回降级。
harness.context.retrieval.min-similarity=${CONTEXT_RETRIEVAL_MIN_SIMILARITY:0.7}
# 是否使用父来源级别的 RRF 融合向量和关键词召回；关闭时保留向量优先的旧排序。
harness.context.retrieval.rrf-enabled=${CONTEXT_RETRIEVAL_RRF_ENABLED:true}
# RRF 常数，值越大越不强调头部名次差异。
harness.context.retrieval.rrf-k=${CONTEXT_RETRIEVAL_RRF_K:60}
# 向量召回在 RRF 中的权重。
harness.context.retrieval.vector-weight=${CONTEXT_RETRIEVAL_VECTOR_WEIGHT:1.0}
# 关键词召回在 RRF 中的权重。
harness.context.retrieval.keyword-weight=${CONTEXT_RETRIEVAL_KEYWORD_WEIGHT:0.7}
# 单个组织每分钟最多创建的 Run 数量。
harness.runtime.max-creates-per-minute=${MAX_CREATES_PER_MINUTE:60}
# 运行 Worker 租约超时后的恢复判定时间（毫秒）。
harness.runtime.recovery-timeout-ms=${RECOVERY_TIMEOUT_MS:120000}
# 单个工具步骤最多自动尝试次数。
harness.runtime.max-tool-attempts=${MAX_TOOL_ATTEMPTS:3}
# 运行详情 SSE 从数据库快照读取更新的轮询间隔（毫秒）。
harness.runtime.event-stream-poll-ms=${RUN_EVENT_STREAM_POLL_MS:750}
# 运行详情 SSE 向订阅者发送心跳的间隔（毫秒）。
harness.runtime.event-stream-heartbeat-ms=${RUN_EVENT_STREAM_HEARTBEAT_MS:15000}
# 运行详情 SSE 同时允许的最大订阅者数量。
harness.runtime.event-stream-max-subscribers=${RUN_EVENT_STREAM_MAX_SUBSCRIBERS:200}

# 是否启用数据保留清理任务；默认关闭以避免演示环境自动删除数据。
harness.data-retention.enabled=${DATA_RETENTION_ENABLED:false}
# Run 记录的最短保留天数；实际保留期不短于审计保留期。
harness.data-retention.run-days=${RUN_RETENTION_DAYS:90}
# 审计事件的保留天数。
harness.data-retention.audit-days=${AUDIT_RETENTION_DAYS:365}
# 上下文记忆的保留天数。
harness.data-retention.memory-days=${MEMORY_RETENTION_DAYS:30}
# embedding 缓存的保留天数；缓存只保存向量，不改变正文的租户和业务保留策略。
harness.data-retention.embedding-cache-days=${EMBEDDING_CACHE_RETENTION_DAYS:30}
# 上下文知识文档软删除后的保留天数。
harness.data-retention.document-days=${DOCUMENT_RETENTION_DAYS:30}
# 已终态 Outbox 事件的保留天数。
harness.data-retention.outbox-days=${OUTBOX_RETENTION_DAYS:14}
# 组织策略审计记录的保留天数。
harness.data-retention.tenant-policy-audit-days=${TENANT_POLICY_AUDIT_RETENTION_DAYS:365}
# API Key 审计记录的保留天数。
harness.data-retention.api-key-audit-days=${API_KEY_AUDIT_RETENTION_DAYS:365}
# 数据保留清理任务的执行间隔（毫秒）。
harness.data-retention.cleanup-interval-ms=${RETENTION_CLEANUP_INTERVAL_MS:3600000}
# 应用启动后首次执行数据保留清理前的延迟（毫秒）。
harness.data-retention.cleanup-initial-delay-ms=${RETENTION_CLEANUP_INITIAL_DELAY_MS:60000}
# 每批数据保留清理最多处理的记录数。
harness.data-retention.batch-size=${RETENTION_BATCH_SIZE:100}
