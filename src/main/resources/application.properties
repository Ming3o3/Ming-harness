spring.application.name=ming-harness
server.port=${SERVER_PORT:8080}
spring.profiles.default=local

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=false
spring.data.redis.repositories.enabled=false

spring.jackson.default-property-inclusion=non_null

# 将请求关联 ID 注入日志级别，便于从网关响应反查后端日志。
logging.pattern.level=%5p [request:%X{requestId:-},trace:%X{traceId:-}]

# 基础健康检查和运行指标；健康探针仅公开整体状态，详细组件摘要走受 RBAC 保护的 /api/health。
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when_authorized}
management.endpoint.health.show-components=${MANAGEMENT_HEALTH_SHOW_COMPONENTS:when_authorized}
management.metrics.tags.application=${spring.application.name}

# 运行模式由 local/local-infra Profile 覆盖。
harness.execution.mode=${HARNESS_EXECUTION_MODE:sync}
# Rabbit 异步评测等待 Worker 回写终态的边界；超时不会取消 Run，只记录当前状态并继续后续用例。
harness.evaluation.wait-timeout-ms=${EVALUATION_WAIT_TIMEOUT_MS:120000}
harness.evaluation.poll-interval-ms=${EVALUATION_POLL_INTERVAL_MS:250}

harness.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# 身份适配：local 兼容本地请求头；生产可切换 api-key 并由密钥系统注入。
harness.auth.mode=${HARNESS_AUTH_MODE:local}
harness.auth.api-keys=${HARNESS_API_KEYS:}

# 本地默认值仅用于演示；生产环境必须从密钥系统注入 AUDIT_INTEGRITY_KEY。
harness.audit.integrity-key=${AUDIT_INTEGRITY_KEY:local-development-audit-integrity-key-change-me}

harness.model.enabled=${MODEL_ENABLED:false}
harness.model.base-url=${MODEL_BASE_URL:https://api.openai.com/v1}
harness.model.api-key=${MODEL_API_KEY:}
harness.model.name=${MODEL_NAME:gpt-4o-mini}
harness.model.fallback-base-url=${MODEL_FALLBACK_BASE_URL:}
harness.model.fallback-api-key=${MODEL_FALLBACK_API_KEY:}
harness.model.fallback-name=${MODEL_FALLBACK_NAME:}
harness.model.max-attempts=${MODEL_MAX_ATTEMPTS:3}
harness.model.retry-backoff-ms=${MODEL_RETRY_BACKOFF_MS:200}
harness.model.circuit-failure-threshold=${MODEL_CIRCUIT_FAILURE_THRESHOLD:3}
harness.model.circuit-open-ms=${MODEL_CIRCUIT_OPEN_MS:30000}
harness.model.input-cost-per-1k-tokens=${MODEL_INPUT_COST_PER_1K_TOKENS:0}
harness.model.output-cost-per-1k-tokens=${MODEL_OUTPUT_COST_PER_1K_TOKENS:0}
harness.model.max-response-chars=${MODEL_MAX_RESPONSE_CHARS:100000}
harness.prompt.version=${PROMPT_VERSION:prompt-v1}
harness.policy.version=${POLICY_VERSION:policy-v1}

# 运行边界默认适合本地演示，生产环境应按租户容量和 SLO 调整
harness.runtime.max-active-runs-per-tenant=${MAX_ACTIVE_RUNS_PER_TENANT:20}
harness.runtime.max-steps-per-run=${MAX_STEPS_PER_RUN:20}
harness.runtime.max-input-length=${MAX_INPUT_LENGTH:10000}
harness.runtime.max-budget=${MAX_RUN_BUDGET:1000}
harness.runtime.model-timeout-ms=${MODEL_TIMEOUT_MS:30000}
harness.runtime.max-context-chars=${MAX_CONTEXT_CHARS:4000}
harness.runtime.max-creates-per-minute=${MAX_CREATES_PER_MINUTE:60}
harness.runtime.recovery-timeout-ms=${RECOVERY_TIMEOUT_MS:120000}
harness.runtime.max-tool-attempts=${MAX_TOOL_ATTEMPTS:3}

# 数据保留默认关闭，避免零依赖演示环境自动删除数据；生产环境请明确设置保留期。
harness.data-retention.enabled=${DATA_RETENTION_ENABLED:false}
harness.data-retention.run-days=${RUN_RETENTION_DAYS:90}
harness.data-retention.audit-days=${AUDIT_RETENTION_DAYS:365}
harness.data-retention.memory-days=${MEMORY_RETENTION_DAYS:30}
harness.data-retention.document-days=${DOCUMENT_RETENTION_DAYS:30}
harness.data-retention.evaluation-days=${EVALUATION_RETENTION_DAYS:90}
harness.data-retention.outbox-days=${OUTBOX_RETENTION_DAYS:14}
harness.data-retention.tenant-policy-audit-days=${TENANT_POLICY_AUDIT_RETENTION_DAYS:365}
harness.data-retention.api-key-audit-days=${API_KEY_AUDIT_RETENTION_DAYS:365}
harness.data-retention.cleanup-interval-ms=${RETENTION_CLEANUP_INTERVAL_MS:3600000}
harness.data-retention.cleanup-initial-delay-ms=${RETENTION_CLEANUP_INITIAL_DELAY_MS:60000}
harness.data-retention.batch-size=${RETENTION_BATCH_SIZE:100}
