spring.application.name=ming-harness
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ming-harness;AUTO_SERVER=TRUE;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

harness.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

harness.model.enabled=${MODEL_ENABLED:false}
harness.model.base-url=${MODEL_BASE_URL:https://api.openai.com/v1}
harness.model.api-key=${MODEL_API_KEY:}
harness.model.name=${MODEL_NAME:gpt-4o-mini}
harness.prompt.version=${PROMPT_VERSION:prompt-v1}
harness.policy.version=${POLICY_VERSION:policy-v1}
