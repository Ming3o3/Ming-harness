# Windows managed local-infra desktop overlay.
# This profile never changes the database or execution model; it only keeps the
# embedded services bound to loopback and lets the Electron supervisor inject
# their dynamically allocated ports and credentials.
spring.config.activate.on-profile=desktop
server.address=127.0.0.1
harness.execution.mode=${HARNESS_EXECUTION_MODE:rabbit}
harness.redis.enabled=${REDIS_ENABLED:true}
harness.messaging.enabled=${RABBITMQ_ENABLED:true}
management.health.redis.enabled=${REDIS_ENABLED:true}
management.health.rabbit.enabled=${RABBITMQ_ENABLED:true}
