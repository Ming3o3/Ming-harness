# OIDC/JWT 认证配置；可与 local-infra 组合为 local-infra,oidc。
# Spring Boot 当前激活的配置 Profile。
spring.config.activate.on-profile=oidc
# 身份认证模式，启用 OIDC/JWT 资源服务器校验。
harness.auth.mode=oidc
# OIDC 提供方的 issuer 地址，用于发现公钥和校验 JWT 签发者；生产环境必须配置。
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI}
# JWT 必须包含的 audience，多个受众使用逗号分隔；为空表示不额外校验受众。
harness.auth.oidc-audience=${OIDC_AUDIENCE:}
