# 当前文件仅在 local Profile 激活时生效；默认使用 H2、进程内执行和演示模型。
# Spring Boot 当前激活的配置 Profile。
spring.config.activate.on-profile=local
# H2 文件数据库连接地址，可通过 DB_URL 覆盖。
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ming-harness;DB_CLOSE_ON_EXIT=FALSE}
# H2 JDBC 驱动类名。
spring.datasource.driver-class-name=org.h2.Driver
# H2 登录用户名，可通过 DB_USERNAME 覆盖。
spring.datasource.username=${DB_USERNAME:sa}
# H2 登录密码，可通过 DB_PASSWORD 覆盖。
spring.datasource.password=${DB_PASSWORD:}
# Hibernate 自动更新本地演示数据库结构。
spring.jpa.hibernate.ddl-auto=update
# 本地 H2 模式不执行 PostgreSQL Flyway 迁移。
spring.flyway.enabled=false
# 运行执行模式；local 默认在当前进程内同步执行。
harness.execution.mode=${HARNESS_EXECUTION_MODE:sync}
# 是否将本地执行切换为进程内后台异步 Worker。
harness.local-execution.async=${LOCAL_ASYNC_EXECUTION:true}
# 运行详情事件流轮询数据库快照的间隔（毫秒）。
harness.runtime.event-stream-poll-ms=${RUN_EVENT_STREAM_POLL_MS:250}
# 是否启用受控工作区及聊天附件能力。
harness.workspace.enabled=${WORKSPACE_ENABLED:true}
# local Profile 仅服务于当前机器的桌面开发；原生目录选择桥接可登记用户显式选择的项目。
# 是否允许桌面原生桥接登记用户选择的本地工作区。
harness.workspace.local-registration-enabled=${WORKSPACE_LOCAL_REGISTRATION_ENABLED:true}
# 是否启用 Redis；local 默认关闭，使用进程内实现。
harness.redis.enabled=false
# 是否启用 RabbitMQ；local 默认关闭，使用进程内执行。
harness.messaging.enabled=false
# 是否暴露 Redis 健康检查组件。
management.health.redis.enabled=false
# 是否暴露 RabbitMQ 健康检查组件。
management.health.rabbit.enabled=false
# local 仅用于开发演示，允许直接查看健康组件详情；生产 Profile 使用 when_authorized。
# Actuator 健康端点显示组件详情的策略。
management.endpoint.health.show-details=always
# Actuator 健康端点显示组件列表的策略。
management.endpoint.health.show-components=always
