# 本地零依赖演示配置，默认使用 H2 和进程内执行。
spring.config.activate.on-profile=local
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ming-harness;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
harness.execution.mode=${HARNESS_EXECUTION_MODE:sync}
harness.redis.enabled=false
harness.messaging.enabled=false
