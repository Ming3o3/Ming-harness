# 测试使用内存 H2 数据库，连接关闭后保留到 JVM 退出。
spring.datasource.url=jdbc:h2:mem:ming-harness-test;DB_CLOSE_DELAY=-1
# 测试数据库 JDBC 驱动类名。
spring.datasource.driver-class-name=org.h2.Driver
# 测试数据库登录用户名。
spring.datasource.username=sa
# 测试数据库登录密码；这里为空。
spring.datasource.password=
# 测试启动时创建结构，结束时删除结构。
spring.jpa.hibernate.ddl-auto=create-drop
# 测试请求不持有 Open Session in View。
spring.jpa.open-in-view=false
# 测试不执行 PostgreSQL Flyway 迁移，使用 Hibernate 创建 H2 结构。
spring.flyway.enabled=false
# 测试使用同步运行模式。
harness.execution.mode=sync
# 测试不启用进程内后台异步 Worker。
harness.local-execution.async=false
# 测试关闭 Redis 共享治理能力。
harness.redis.enabled=false
# 测试关闭 RabbitMQ 消息和 Outbox Relay。
harness.messaging.enabled=false
# 测试关闭 Redis 健康检查组件。
management.health.redis.enabled=false
# 测试关闭 RabbitMQ 健康检查组件。
management.health.rabbit.enabled=false
# 测试 Actuator 对外暴露的端点列表。
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# 测试健康端点仅在授权时显示详情。
management.endpoint.health.show-details=when_authorized
# 测试健康端点仅在授权时显示组件列表。
management.endpoint.health.show-components=when_authorized
# 测试允许访问 API 的前端来源。
harness.cors.allowed-origins=http://localhost:5173
# 测试用审计 HMAC 完整性密钥。
harness.audit.integrity-key=test-audit-integrity-key
# 测试用工作区路径加密密钥。
harness.workspace.path-encryption-key=test-workspace-path-encryption-key
# 测试用桌面工作区桥接令牌。
harness.workspace.desktop-bridge-token=test-desktop-bridge-token
# 测试关闭真实外部模型，使用演示模型或 Mock。
harness.model.enabled=false
# 测试使用的模型名称。
harness.model.name=demo-model
# 测试模型请求最多尝试次数。
harness.model.max-attempts=2
# 测试模型请求重试间隔（毫秒）。
harness.model.retry-backoff-ms=0
# 测试模型熔断连续失败阈值。
harness.model.circuit-failure-threshold=3
# 测试模型熔断打开持续时间（毫秒）。
harness.model.circuit-open-ms=30000
# 测试模型输入每 1,000 Token 的成本。
harness.model.input-cost-per-1k-tokens=0
# 测试模型输出每 1,000 Token 的成本。
harness.model.output-cost-per-1k-tokens=0
# 测试模型响应最大字符数。
harness.model.max-response-chars=100000
# 测试默认提示词版本。
harness.prompt.version=prompt-v1
# 测试默认策略版本。
harness.policy.version=policy-v1
# 测试单组织活动 Run 数量上限。
harness.runtime.max-active-runs-per-tenant=20
# 测试单次 Run 步骤数上限。
harness.runtime.max-steps-per-run=1000
# 测试单次 Run 输入最大字符数。
harness.runtime.max-input-length=10000
# 测试单次 Run 预算上限。
harness.runtime.max-budget=1000
# 测试模型调用超时时间（毫秒）。
harness.runtime.model-timeout-ms=30000
# 测试模型上下文最大字符数。
harness.runtime.max-context-chars=4000
# 测试单组织每分钟创建 Run 数量上限。
harness.runtime.max-creates-per-minute=60
# 测试 Worker 租约恢复判定超时时间（毫秒）。
harness.runtime.recovery-timeout-ms=120000
# 测试应用启动后首次扫描过期 Worker 租约前的延迟（毫秒）。
harness.runtime.recovery-initial-delay-ms=600000
# 测试扫描过期 Worker 租约的间隔（毫秒）。
harness.runtime.recovery-scan-ms=600000
# 测试关闭数据保留清理任务。
harness.data-retention.enabled=false
# 测试 Run 记录保留天数。
harness.data-retention.run-days=1
# 测试审计事件保留天数。
harness.data-retention.audit-days=1
# 测试上下文记忆保留天数。
harness.data-retention.memory-days=1
# 测试 embedding 缓存保留天数。
harness.data-retention.embedding-cache-days=1
# 测试知识文档保留天数。
harness.data-retention.document-days=1
# 测试评测报告保留天数。
harness.data-retention.evaluation-days=1
# 测试终态 Outbox 事件保留天数。
harness.data-retention.outbox-days=1
# 测试组织策略审计记录保留天数。
harness.data-retention.tenant-policy-audit-days=1
# 测试 API Key 审计记录保留天数。
harness.data-retention.api-key-audit-days=1
# 测试数据保留清理任务执行间隔（毫秒）。
harness.data-retention.cleanup-interval-ms=3600000
# 测试数据保留清理首次执行延迟（毫秒）。
harness.data-retention.cleanup-initial-delay-ms=60000
# 测试每批清理最多处理的记录数。
harness.data-retention.batch-size=100
