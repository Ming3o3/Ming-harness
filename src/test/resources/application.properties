spring.datasource.url=jdbc:h2:mem:ming-harness-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
harness.execution.mode=sync
harness.redis.enabled=false
harness.messaging.enabled=false
management.health.redis.enabled=false
management.health.rabbit.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
harness.cors.allowed-origins=http://localhost:5173
harness.audit.integrity-key=test-audit-integrity-key
harness.model.enabled=false
harness.model.name=demo-model
harness.model.max-attempts=2
harness.model.retry-backoff-ms=0
harness.model.circuit-failure-threshold=3
harness.model.circuit-open-ms=30000
harness.model.input-cost-per-1k-tokens=0
harness.model.output-cost-per-1k-tokens=0
harness.model.max-response-chars=100000
harness.prompt.version=prompt-v1
harness.policy.version=policy-v1
harness.runtime.max-active-runs-per-tenant=20
harness.runtime.max-steps-per-run=20
harness.runtime.max-input-length=10000
harness.runtime.max-budget=1000
harness.runtime.model-timeout-ms=30000
harness.runtime.max-context-chars=4000
harness.runtime.max-creates-per-minute=60
harness.runtime.recovery-timeout-ms=120000
harness.data-retention.enabled=false
harness.data-retention.run-days=1
harness.data-retention.audit-days=1
harness.data-retention.memory-days=1
harness.data-retention.document-days=1
harness.data-retention.evaluation-days=1
harness.data-retention.outbox-days=1
harness.data-retention.tenant-policy-audit-days=1
harness.data-retention.cleanup-interval-ms=3600000
harness.data-retention.cleanup-initial-delay-ms=60000
harness.data-retention.batch-size=100
